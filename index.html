<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For yoooouuuu <3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   STYLES.CSS  —  design tokens, layout, and every animation state
   (kept in one file for the artifact preview; the section headers below
   mark exactly where you'd split this into styles.css / script.js if you
   drop it into a real project)
   ========================================================================== */

:root{
  /* ---- color tokens ---- */
  --bg:               #f4e6e1;
  --bg-deep:          #2c221d;
  --envelope:         #e7bcb2;
  --envelope-shade:   #d29e92;
  --envelope-deep:    #b87d70;
  --envelope-light:   #f4d8cf;
  --paper:            #fbf4e8;
  --paper-edge:       #efe2c9;
  --ink:              #5a4436;
  --ink-soft:         #8a7360;
  --gold:             #c9a15a;
  --gold-dark:        #9c7736;
  --sage:             #8fa377;
  --rose-particle:    #d98c86;

  /* ---- type tokens ---- */
  --font-script: 'Parisienne', cursive;
  --font-body:   'EB Garamond', 'Cormorant Garamond', serif;
  --font-ui:     'Jost', sans-serif;

  /* ---- motion tokens ---- */
  --ease-hinge: cubic-bezier(.65,-0.15,.32,1.24);
  --ease-soft:  cubic-bezier(.22,.68,.31,1);
  --ease-out:   cubic-bezier(.16,1,.3,1);
  --motion: 1;
}

@media (prefers-reduced-motion: reduce){
  :root{ --motion: 0; }
}

*{ box-sizing: border-box; }

html,body{
  height:100%;
  margin:0;
  background: radial-gradient(ellipse at 50% 30%, #faf0e9 0%, var(--bg) 55%, #ecd6ce 100%);
  font-family: var(--font-body);
  color: var(--ink);
  overflow: hidden;
}

/* ==========================================================================
   STAGE — full viewport wrapper
   ========================================================================== */

.stage{
  position: relative;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  perspective: 1400px;
}

.ambient-glow{
  position:absolute;
  width: min(70vw, 560px);
  height: min(70vw, 560px);
  border-radius:50%;
  background: radial-gradient(circle, rgba(233,180,163,.55) 0%, rgba(233,180,163,0) 70%);
  filter: blur(10px);
  pointer-events:none;
  transition: opacity .8s var(--ease-soft), transform .8s var(--ease-soft);
}
.stage[data-state="reading"] .ambient-glow{ opacity:.35; transform: scale(1.4); }

/* ==========================================================================
   SCENE / ENVELOPE
   ========================================================================== */

.scene{
  position: relative;
  width: clamp(240px, 42vw, 360px);
  aspect-ratio: 3 / 2;
  cursor: pointer;
  outline: none;
}
.scene:hover .envelope{ filter: drop-shadow(0 26px 34px rgba(120,78,60,.34)); }
.scene:focus-visible .envelope{
  box-shadow: 0 0 0 3px var(--gold), 0 30px 60px -20px rgba(90,60,40,.45);
}
.stage[data-state="reading"] .scene,
.stage[data-state="closing-1"] .scene,
.stage[data-state="closing-2"] .scene{ cursor: default; }

.envelope{
  position:absolute;
  inset:0;
  transform-style: preserve-3d;
  animation: idle-float 5s ease-in-out infinite;
  filter: drop-shadow(0 22px 30px rgba(120, 78, 60, .28));
  transition: transform .5s var(--ease-soft), opacity .5s var(--ease-soft), filter .5s var(--ease-soft);
}
@keyframes idle-float{
  0%,100%{ transform: translateY(0) rotate(0deg); }
  50%{ transform: translateY(calc(-6px * var(--motion))) rotate(calc(-0.6deg * var(--motion))); }
}
.stage:not([data-state="closed"]) .envelope{ animation-play-state: paused; }
.scene.pressed .envelope{ transform: scale(.96); animation-play-state: paused; }

/* recede the envelope once the letter is being read
   (opacity only on chrome — not the letter, or the paper looks faded) */
.stage[data-state="reading"] .envelope{
  transform: scale(.82) translateY(18%);
  filter: drop-shadow(0 10px 18px rgba(120,78,60,.18));
}
.stage[data-state="reading"] .envelope-back,
.stage[data-state="reading"] .envelope-side,
.stage[data-state="reading"] .envelope-front,
.stage[data-state="reading"] .envelope-flap{
  opacity: .45;
  transition: opacity .5s var(--ease-soft);
}

.envelope-back{
  position:absolute;
  inset:0;
  border-radius: 10px;
  background: linear-gradient(155deg, var(--envelope-light), var(--envelope) 55%, var(--envelope-shade));
}
.envelope-back::after{ /* subtle paper grain */
  content:"";
  position:absolute; inset:0;
  border-radius:10px;
  background-image: radial-gradient(rgba(255,255,255,.35) 1px, transparent 1px);
  background-size: 7px 7px;
  opacity:.15;
  mix-blend-mode: overlay;
}

.envelope-side{
  position:absolute;
  inset:0;
  z-index:3;
  background: linear-gradient(160deg, var(--envelope-shade), var(--envelope-deep));
}
.envelope-side--left{ clip-path: polygon(0% 0%, 0% 100%, 50% 47%); border-radius: 10px 0 0 10px; }
.envelope-side--right{ clip-path: polygon(100% 0%, 100% 100%, 50% 47%); border-radius: 0 10px 10px 0; }

.envelope-front{
  position:absolute;
  inset:0;
  z-index:4;
  clip-path: polygon(0% 100%, 100% 100%, 50% 47%);
  background: linear-gradient(160deg, var(--envelope-shade), var(--envelope-deep));
  border-radius: 0 0 10px 10px;
}

.envelope-flap{
  position:absolute;
  inset:0;
  z-index:5;
  clip-path: polygon(0% 0%, 100% 0%, 50% 58%);
  background: linear-gradient(200deg, var(--envelope-light), var(--envelope) 60%);
  transform-origin: 50% 0%;
  transform: rotateX(0deg);
  transition: transform .65s var(--ease-hinge), z-index 0s .1s;
  border-radius: 10px 10px 0 0;
}
.stage:not([data-state="closed"]) .envelope-flap{
  transform: rotateX(-162deg) translateZ(1px);
  z-index: 1;
}

/* ---- wax seal, sitting on the flap's point ---- */
.wax-seal{
  position:absolute;
  left:50%; top:38%;
  width: 15%; aspect-ratio:1;
  transform: translate(-50%,-50%);
  z-index: 2;
}
.wax-seal-half{
  position:absolute; inset:0;
  background: radial-gradient(circle at 35% 30%, var(--gold), var(--gold-dark) 75%);
  box-shadow: inset 0 -2px 4px rgba(0,0,0,.25), 0 2px 4px rgba(0,0,0,.25);
  transition: transform .5s var(--ease-out), opacity .5s var(--ease-out);
}
.wax-seal-half--left{ clip-path: polygon(0 0, 50% 0, 50% 100%, 0 100%); border-radius: 50% 0 0 50%; }
.wax-seal-half--right{ clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%); border-radius: 0 50% 50% 0; }
.stage:not([data-state="closed"]) .wax-seal-half--left{ transform: translate(calc(-70% * var(--motion)), calc(-20% * var(--motion))) rotate(calc(-18deg * var(--motion))); opacity:0; }
.stage:not([data-state="closed"]) .wax-seal-half--right{ transform: translate(calc(70% * var(--motion)), calc(-20% * var(--motion))) rotate(calc(18deg * var(--motion))); opacity:0; }

/* ==========================================================================
   LETTER
   ========================================================================== */

.letter{
  position:absolute;
  left:50%; top:6%;
  width:82%; height:80%;
  transform: translate(-50%, 4%) scale(.94);
  z-index:2;
  transition:
    transform .55s var(--ease-soft),
    width .55s var(--ease-soft),
    height .55s var(--ease-soft),
    top .55s var(--ease-soft),
    z-index 0s;
}

.stage[data-state="opening"] .letter{ z-index:2; }

.stage[data-state="emerging"] .letter,
.stage[data-state="pause"] .letter{
  transform: translate(-50%, calc(-46% * var(--motion))) scale(.97);
  z-index:6;
}

.stage[data-state="out"] .letter{
  transform: translate(-50%, calc(-92% * var(--motion))) rotate(calc(-2.5deg * var(--motion))) scale(1.03);
  z-index:6;
}

/* the reading state escapes the envelope's small coordinate box entirely */
.stage[data-state="reading"] .letter{
  position: fixed;
  left:50%; top:50%;
  width: min(92vw, 560px);
  height: min(82vh, 640px);
  transform: translate(-50%,-50%) rotate(0deg) scale(1);
  z-index: 20;
}

.stage[data-state="closing-1"] .letter{
  transform: translate(-50%, calc(-92% * var(--motion))) rotate(calc(-2deg * var(--motion))) scale(1.02);
  z-index:6;
}
.stage[data-state="closing-2"] .letter{
  transform: translate(-50%, 4%) scale(.94);
  z-index:2;
}

.letter-paper{
  position:relative;
  width:100%; height:100%;
  overflow-y:auto;
  background:
    radial-gradient(circle at 12% 8%, rgba(255,255,255,.5), transparent 40%),
    linear-gradient(180deg, var(--paper), var(--paper-edge));
  border-radius: 4px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.6) inset,
    0 25px 40px -18px rgba(90,60,40,.4);
  border: 1px solid rgba(160,120,90,.18);
  padding: clamp(20px, 6%, 44px);
  scrollbar-width: thin;
  scrollbar-color: var(--gold) transparent;
}
.letter-paper::-webkit-scrollbar{ width:6px; }
.letter-paper::-webkit-scrollbar-thumb{ background: var(--gold); border-radius:3px; }

.floral-corner{
  position:absolute;
  width: 46px; height: 46px;
  color: var(--sage);
  opacity:.6;
  pointer-events:none;
}
.floral-corner--tl{ top:6px; left:6px; }
.floral-corner--br{ bottom:6px; right:6px; transform: rotate(180deg); }

.letter-title{
  font-family: var(--font-script);
  font-size: clamp(1.7rem, 4.5vw, 2.4rem);
  color: var(--ink);
  margin: 4px 0 18px;
  line-height:1.15;
}
.letter-title .ch{
  display:inline-block;
  opacity:0;
  transform: translateY(6px) rotate(-3deg);
}
.stage[data-state="reading"] .letter-title.animate .ch{
  animation: ink-in .5s var(--ease-out) forwards;
  animation-delay: calc(var(--i) * 35ms);
}
@keyframes ink-in{
  to{ opacity:1; transform: translateY(0) rotate(0deg); }
}

.letter-body p{
  font-family: var(--font-body);
  font-size: clamp(1rem, 2.4vw, 1.15rem);
  line-height:1.75;
  color: var(--ink);
  margin: 0 0 1.1em;
  opacity:0;
  transform: translateY(8px);
  transition: opacity .6s var(--ease-soft), transform .6s var(--ease-soft);
}
.stage[data-state="reading"] .letter-body p{ opacity:1; transform: translateY(0); }
.letter-body p:nth-of-type(1){ transition-delay:.25s; }
.letter-body p:nth-of-type(2){ transition-delay:.4s; }
.letter-body p:nth-of-type(3){ transition-delay:.55s; }
.letter-body p:nth-of-type(4){ transition-delay:.7s; }

.letter-sign{
  font-family: var(--font-script);
  font-size: clamp(1.3rem, 3vw, 1.7rem);
  color: var(--gold-dark);
  margin-top: 1.4em;
  opacity:0;
  transform: translateY(8px);
  transition: opacity .6s var(--ease-soft) .85s, transform .6s var(--ease-soft) .85s;
}
.stage[data-state="reading"] .letter-sign{ opacity:1; transform: translateY(0); }

/* ==========================================================================
   OVERLAY / CLOSE / HINT / SOUND TOGGLE
   ========================================================================== */

.overlay{
  position:fixed; inset:0;
  background: radial-gradient(ellipse at 50% 40%, rgba(50,34,24,.22), rgba(35,24,18,.48));
  opacity:0;
  pointer-events:none;
  transition: opacity .6s var(--ease-soft);
  z-index:15;
}
.stage[data-state="reading"] .overlay{ opacity:1; pointer-events:auto; }

/* keep the open letter above the dimmer so paper stays crisp */
.stage[data-state="reading"] .scene{ z-index: 20; }

.close-btn{
  position:fixed;
  top: max(18px, 3vh);
  right: max(18px, 3vw);
  z-index: 25;
  width:42px; height:42px;
  border-radius:50%;
  border: 1px solid rgba(255,255,255,.4);
  background: rgba(44,34,29,.55);
  color:#fbf4e8;
  font-family: var(--font-ui);
  font-size:1.1rem;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transform: scale(.7) rotate(-45deg);
  transition: opacity .4s var(--ease-out) .3s, transform .4s var(--ease-out) .3s, background .2s;
  backdrop-filter: blur(4px);
}
.close-btn:hover{ background: rgba(44,34,29,.8); }
.stage[data-state="reading"] .close-btn{ opacity:1; transform: scale(1) rotate(0deg); pointer-events:auto; }
.close-btn:not([data-active]){ pointer-events:none; }

.hint{
  position:absolute;
  bottom: 8%;
  font-family: var(--font-ui);
  font-weight:300;
  letter-spacing:.14em;
  text-transform:uppercase;
  font-size:.72rem;
  color: var(--ink-soft);
  opacity:.75;
  transition: opacity .4s ease;
  pointer-events:none;
}
.stage:not([data-state="closed"]) .hint{ opacity:0; }

.sound-toggle{
  position:fixed;
  bottom: max(18px, 3vh);
  right: max(18px, 3vw);
  z-index:6;
  width:38px; height:38px;
  border-radius:50%;
  border:1px solid rgba(90,68,54,.25);
  background: rgba(255,255,255,.5);
  color: var(--ink-soft);
  font-size:1rem;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition: background .2s, color .2s;
}
.sound-toggle:hover{ background: rgba(255,255,255,.8); }
.sound-toggle[data-muted="true"]{ color: #b98a80; }

/* ==========================================================================
   PARTICLES — floating hearts & sparkles
   ========================================================================== */

.particles{
  position:fixed; inset:0;
  z-index:22;
  pointer-events:none;
  overflow:hidden;
}
.particle{
  position:absolute;
  bottom:-5%;
  font-size: var(--size, 16px);
  color: var(--pcolor, var(--rose-particle));
  opacity:0;
  animation: rise var(--dur, 6s) ease-in forwards;
  will-change: transform, opacity;
}
@keyframes rise{
  0%{ opacity:0; transform: translate(0,0) rotate(0deg) scale(.6); }
  10%{ opacity:.9; }
  85%{ opacity:.8; }
  100%{ opacity:0; transform: translate(var(--drift,20px), -115vh) rotate(var(--spin,180deg)) scale(1); }
}

/* ==========================================================================
   RESPONSIVE
   ========================================================================== */

@media (max-width: 560px){
  .scene{ width: clamp(210px, 58vw, 300px); }
  .stage[data-state="reading"] .letter{ width:94vw; height:80dvh; }
  .letter-paper{ padding: 22px 18px; }
}

@media (prefers-reduced-motion: reduce){
  .envelope, .letter, .wax-seal-half, .letter-title .ch, .letter-body p, .letter-sign,
  .envelope-flap, .close-btn, .ambient-glow, .overlay{
    transition-duration: .01s !important;
    animation-duration: .01s !important;
  }
}
</style>
</head>
<body>

<div class="stage" id="stage" data-state="closed">
  <div class="ambient-glow" aria-hidden="true"></div>

  <div class="scene" id="scene" tabindex="0" role="button" aria-label="Open the love letter" aria-expanded="false">
    <div class="envelope" id="envelope">
      <div class="envelope-back"></div>
      <div class="envelope-side envelope-side--left"></div>
      <div class="envelope-side envelope-side--right"></div>

      <div class="letter" id="letter">
        <div class="letter-paper" id="letterPaper">
          <svg class="floral-corner floral-corner--tl" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M4 44C4 30 14 18 26 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="27" cy="12" r="3.2" fill="currentColor"/>
            <circle cx="18" cy="22" r="2.4" fill="currentColor" opacity=".75"/>
            <circle cx="10" cy="34" r="2" fill="currentColor" opacity=".55"/>
          </svg>
          <svg class="floral-corner floral-corner--br" viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M4 44C4 30 14 18 26 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="27" cy="12" r="3.2" fill="currentColor"/>
            <circle cx="18" cy="22" r="2.4" fill="currentColor" opacity=".75"/>
            <circle cx="10" cy="34" r="2" fill="currentColor" opacity=".55"/>
          </svg>

          <h1 class="letter-title" id="letterTitle"></h1>
          <div class="letter-body" id="letterBody"></div>
        </div>
      </div>

      <div class="envelope-front"></div>

      <div class="envelope-flap">
        <div class="wax-seal" id="waxSeal">
          <div class="wax-seal-half wax-seal-half--left"></div>
          <div class="wax-seal-half wax-seal-half--right"></div>
        </div>
      </div>
    </div>
  </div>

  <p class="hint">tap the envelope</p>
  <button class="close-btn" id="closeBtn" aria-label="Close the letter">✕</button>
  <button class="sound-toggle" id="soundToggle" data-muted="false" aria-label="Mute sound" title="Toggle sound">♪</button>
  <div class="overlay" id="overlay"></div>
  <div class="particles" id="particles" aria-hidden="true"></div>
</div>

<script>
/* ==========================================================================
   SCRIPT.JS — content config, staged sequencing, particles, sound, a11y
   ========================================================================== */

// -------------------------------------------------------------------------
// 1. CONTENT — edit these to personalize the letter
// -------------------------------------------------------------------------
const LETTER = {
  recipient: "baaabbyyy",
  title: "heeeeyyyy", // leave null to auto-build "My Dearest {recipient},"
  paragraphs: [
    "Happy girlfriend day baby, i'm v happy that you are now in my life and am so happy you are going to be the one who I get to see and talk to everyday",
    "Long distance isn't the easiest but we ARE making it work and WILL continue to make it work i knoww it, I miss you soooooo much and cannot wait to see you <3",
    "Enjoy your day and maybe have some shrimp and a borgar because today is your day -3-",
    "and andddd, no scratch and sniff :p andddd give stinky kitty some boops for me and anddd i want to touch and kiss your face"
  ],
  signature: "mmmmmwaaaahhh"
};

// -------------------------------------------------------------------------
// 2. SETUP
// -------------------------------------------------------------------------
const stage       = document.getElementById('stage');
const scene       = document.getElementById('scene');
const closeBtn    = document.getElementById('closeBtn');
const particlesEl = document.getElementById('particles');
const soundToggle = document.getElementById('soundToggle');
const titleEl     = document.getElementById('letterTitle');
const bodyEl      = document.getElementById('letterBody');
const letterPaper = document.getElementById('letterPaper');

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Build the title as individually-animatable letters ("handwriting" reveal)
(function buildTitle(){
  const text = LETTER.title || `My Dearest ${LETTER.recipient},`;
  titleEl.setAttribute('aria-label', text);
  text.split('').forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'ch';
    span.style.setProperty('--i', i);
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    span.setAttribute('aria-hidden', 'true');
    titleEl.appendChild(span);
  });
})();

// Build paragraphs + signature
LETTER.paragraphs.forEach(text => {
  const p = document.createElement('p');
  p.textContent = text;
  bodyEl.appendChild(p);
});
const signEl = document.createElement('p');
signEl.className = 'letter-sign';
signEl.innerHTML = LETTER.signature.split('\n').join('<br>');
bodyEl.appendChild(signEl);

// -------------------------------------------------------------------------
// 3. TIMING — the cinematic sequence
// -------------------------------------------------------------------------
const T = prefersReducedMotion
  ? { press:0, flap:0, emerge:0, pause:0, out:0 }
  : { press:150, flap:650, emerge:520, pause:320, out:520 };

const wait = ms => new Promise(res => setTimeout(res, ms));
let isAnimating = false;
let particleTimer = null;

function setState(name){ stage.setAttribute('data-state', name); }

async function openLetter(){
  if (isAnimating || stage.dataset.state !== 'closed') return;
  isAnimating = true;
  playRustle();

  scene.classList.add('pressed');
  await wait(T.press);
  scene.classList.remove('pressed');

  setState('opening');            // flap hinges open, wax seal cracks apart
  await wait(T.flap);

  setState('emerging');           // letter slides up, still tucked in envelope
  await wait(T.emerge);

  setState('pause');              // brief hold — "pauses halfway"
  await wait(T.pause);

  setState('out');                // letter clears the envelope, slight rotation
  await wait(T.out);

  setState('reading');            // zoom/settle into the full reading view
  scene.setAttribute('aria-expanded', 'true');
  closeBtn.setAttribute('data-active', 'true');

  titleEl.classList.add('animate');
  startParticles();
  closeBtn.focus();

  isAnimating = false;
}

async function closeLetter(){
  if (isAnimating || stage.dataset.state !== 'reading') return;
  isAnimating = true;
  playRustle();

  stopParticles();
  titleEl.classList.remove('animate');
  closeBtn.removeAttribute('data-active');

  setState('closing-1');          // drop back down to the in-scene "out" spot
  await wait(T.out || 260);

  setState('closing-2');          // slide back down into the envelope
  await wait(T.emerge || 260);

  setState('opening');            // still open, letter tucked away
  await wait(150);

  setState('closed');             // flap seals shut, wax reforms
  scene.setAttribute('aria-expanded', 'false');
  scene.focus();

  isAnimating = false;
}

// -------------------------------------------------------------------------
// 4. INTERACTION — click + keyboard
// -------------------------------------------------------------------------
scene.addEventListener('click', () => {
  if (stage.dataset.state === 'closed') openLetter();
});
scene.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && stage.dataset.state === 'closed'){
    e.preventDefault();
    openLetter();
  }
});
closeBtn.addEventListener('click', closeLetter);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && stage.dataset.state === 'reading') closeLetter();
});

// -------------------------------------------------------------------------
// 5. AMBIENT PARALLAX (idle state only, pointer devices, motion allowed)
// -------------------------------------------------------------------------
if (!prefersReducedMotion && window.matchMedia('(pointer: fine)').matches){
  const envelope = document.getElementById('envelope');
  let raf = null;
  window.addEventListener('mousemove', e => {
    if (stage.dataset.state !== 'closed') return;
    if (raf) return;
    raf = requestAnimationFrame(() => {
      const x = (e.clientX / window.innerWidth - 0.5) * 10;
      const y = (e.clientY / window.innerHeight - 0.5) * 8;
      envelope.style.setProperty('--parallax', `${x}px, ${y}px`);
      envelope.style.transform = `translate(${x}px, ${y}px)`;
      raf = null;
    });
  });
  window.addEventListener('mouseleave', () => { envelope.style.transform = ''; });
}

// -------------------------------------------------------------------------
// 6. PARTICLES — floating hearts & sparkles while reading
// -------------------------------------------------------------------------
const GLYPHS = [
  { ch:'♥', color:'#d98c86' },
  { ch:'♥', color:'#e3a8a1' },
  { ch:'✦', color:'#c9a15a' },
  { ch:'✧', color:'#d9c290' }
];

function spawnParticle(){
  const g = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
  const el = document.createElement('span');
  el.className = 'particle';
  el.textContent = g.ch;
  const size = 10 + Math.random() * 16;
  const left = 8 + Math.random() * 84;
  const dur = 5 + Math.random() * 3.5;
  const drift = (Math.random() - 0.5) * 160;
  const spin = (Math.random() - 0.5) * 220;
  el.style.left = left + 'vw';
  el.style.setProperty('--size', size + 'px');
  el.style.setProperty('--pcolor', g.color);
  el.style.setProperty('--dur', dur + 's');
  el.style.setProperty('--drift', drift + 'px');
  el.style.setProperty('--spin', spin + 'deg');
  particlesEl.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
}

function startParticles(){
  if (prefersReducedMotion) return;
  spawnParticle();
  particleTimer = setInterval(spawnParticle, 550);
}
function stopParticles(){
  clearInterval(particleTimer);
  particleTimer = null;
}

// -------------------------------------------------------------------------
// 7. SOUND — a tiny synthesized paper-rustle (no external audio files)
// -------------------------------------------------------------------------
let audioCtx = null;
let muted = false;

soundToggle.addEventListener('click', () => {
  muted = !muted;
  soundToggle.setAttribute('data-muted', muted);
  soundToggle.textContent = muted ? '✕' : '♪';
  soundToggle.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
});

function playRustle(){
  if (muted || prefersReducedMotion) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const duration = 0.35;
    const bufferSize = audioCtx.sampleRate * duration;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++){
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;

    const bandpass = audioCtx.createBiquadFilter();
    bandpass.type = 'bandpass';
    bandpass.frequency.value = 2200;
    bandpass.Q.value = 0.6;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

    noise.connect(bandpass).connect(gain).connect(audioCtx.destination);
    noise.start();
    noise.stop(audioCtx.currentTime + duration);
  }catch(err){ /* Web Audio unsupported — fail silently */ }
}
</script>
